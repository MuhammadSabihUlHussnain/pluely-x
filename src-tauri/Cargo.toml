[package]
name = "pluelyx"
version = "0.1.0"
description = "Pluely X - a meeting, interview, lecture and screen copilot for Windows (rebuilt from Pluely)"
authors = ["Muhammad Sabih Ul Hussnain <sabih@infalytics.com>", "Srikanth Nani <mail@srikanthnani.com>"]
license = "GPL-3.0"
repository = "https://github.com/iamsrikanthnani/pluely"
readme = "../README.md"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "pluelyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-autostart = "2.5.0"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
keyring = { version = "3", features = ["windows-native"] }
image = "0.25.6"
xcap = "0.0.12"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
fastrand = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Performance",
] }
wasapi = "0.19.0"
windows-core = "0.61"

# Startup repair of migration checksums that differ only by line endings (db::repair_plugin).
[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["sqlite", "runtime-tokio"]

[dependencies.sha2]
version = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
hound = "3.5.1"
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

[profile.dev.package."*"]
opt-level = 2
